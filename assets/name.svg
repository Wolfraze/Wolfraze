<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 250" width="100%" role="img" aria-label="Siddharth Patil">
<style>
.L0{opacity:0;animation:d0 10s infinite}@keyframes d0{0%,2%{transform:translateY(-230px);opacity:0}6%{transform:translateY(16px);opacity:1}8%{transform:translateY(-7px);opacity:1}10%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L1{opacity:0;animation:d1 10s infinite}@keyframes d1{0%,5%{transform:translateY(-230px);opacity:0}9%{transform:translateY(16px);opacity:1}11%{transform:translateY(-7px);opacity:1}13%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L2{opacity:0;animation:d2 10s infinite}@keyframes d2{0%,8%{transform:translateY(-230px);opacity:0}12%{transform:translateY(16px);opacity:1}14%{transform:translateY(-7px);opacity:1}16%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L3{opacity:0;animation:d3 10s infinite}@keyframes d3{0%,11%{transform:translateY(-230px);opacity:0}15%{transform:translateY(16px);opacity:1}17%{transform:translateY(-7px);opacity:1}19%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L4{opacity:0;animation:d4 10s infinite}@keyframes d4{0%,14%{transform:translateY(-230px);opacity:0}18%{transform:translateY(16px);opacity:1}20%{transform:translateY(-7px);opacity:1}22%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L5{opacity:0;animation:d5 10s infinite}@keyframes d5{0%,17%{transform:translateY(-230px);opacity:0}21%{transform:translateY(16px);opacity:1}23%{transform:translateY(-7px);opacity:1}25%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L6{opacity:0;animation:d6 10s infinite}@keyframes d6{0%,20%{transform:translateY(-230px);opacity:0}24%{transform:translateY(16px);opacity:1}26%{transform:translateY(-7px);opacity:1}28%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L7{opacity:0;animation:d7 10s infinite}@keyframes d7{0%,23%{transform:translateY(-230px);opacity:0}27%{transform:translateY(16px);opacity:1}29%{transform:translateY(-7px);opacity:1}31%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L8{opacity:0;animation:d8 10s infinite}@keyframes d8{0%,26%{transform:translateY(-230px);opacity:0}30%{transform:translateY(16px);opacity:1}32%{transform:translateY(-7px);opacity:1}34%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L9{opacity:0;animation:d9 10s infinite}@keyframes d9{0%,29%{transform:translateY(-230px);opacity:0}33%{transform:translateY(16px);opacity:1}35%{transform:translateY(-7px);opacity:1}37%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L10{opacity:0;animation:d10 10s infinite}@keyframes d10{0%,32%{transform:translateY(-230px);opacity:0}36%{transform:translateY(16px);opacity:1}38%{transform:translateY(-7px);opacity:1}40%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L11{opacity:0;animation:d11 10s infinite}@keyframes d11{0%,35%{transform:translateY(-230px);opacity:0}39%{transform:translateY(16px);opacity:1}41%{transform:translateY(-7px);opacity:1}43%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L12{opacity:0;animation:d12 10s infinite}@keyframes d12{0%,38%{transform:translateY(-230px);opacity:0}42%{transform:translateY(16px);opacity:1}44%{transform:translateY(-7px);opacity:1}46%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.L13{opacity:0;animation:d13 10s infinite}@keyframes d13{0%,41%{transform:translateY(-230px);opacity:0}45%{transform:translateY(16px);opacity:1}47%{transform:translateY(-7px);opacity:1}49%,86%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}
.glow{animation:gw 3s ease-in-out infinite}@keyframes gw{0%,100%{opacity:.25}50%{opacity:.75}}
.g1,.g2{opacity:0}.g1{animation:gl 10s infinite}.g2{animation:gl 10s infinite .1s}
@keyframes gl{0%,60%,100%{opacity:0;transform:translate(0,0)}62%{opacity:.8;transform:translate(-7px,3px)}64%{opacity:.8;transform:translate(7px,-3px)}66%{opacity:.8;transform:translate(-3px,1px)}68%{opacity:0}78%{opacity:0}79%{opacity:.8;transform:translate(6px,2px)}81%{opacity:0}}
.sub{opacity:0;animation:sb 10s infinite}@keyframes sb{0%,52%{opacity:0;transform:translateY(8px)}60%,86%{opacity:1;transform:translateY(0)}92%,100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:br 10s infinite}@keyframes br{0%,48%{transform:scaleX(0)}60%,86%{transform:scaleX(1)}92%,100%{transform:scaleX(0)}}
.shine{animation:sh 3.4s linear infinite}@keyframes sh{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}
.scan{animation:sc 4s linear infinite}@keyframes sc{from{transform:translateY(-8px)}to{transform:translateY(260px)}}
.tw{animation:tw 2.2s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.tick{animation:tk 1s steps(1) infinite}@keyframes tk{50%{opacity:0}}
.spin{animation:sp 4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
<defs>
<filter id="blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
<g id="nm" font-family="Impact,'Arial Black',Haettenschweiler,sans-serif" font-size="98"><text class="L0" x="76" y="148" text-anchor="middle">S</text><text class="L1" x="152" y="148" text-anchor="middle">I</text><text class="L2" x="228" y="148" text-anchor="middle">D</text><text class="L3" x="304" y="148" text-anchor="middle">D</text><text class="L4" x="380" y="148" text-anchor="middle">H</text><text class="L5" x="456" y="148" text-anchor="middle">A</text><text class="L6" x="532" y="148" text-anchor="middle">R</text><text class="L7" x="608" y="148" text-anchor="middle">T</text><text class="L8" x="684" y="148" text-anchor="middle">H</text><text class="L9" x="820" y="148" text-anchor="middle">P</text><text class="L10" x="896" y="148" text-anchor="middle">A</text><text class="L11" x="972" y="148" text-anchor="middle">T</text><text class="L12" x="1048" y="148" text-anchor="middle">I</text><text class="L13" x="1124" y="148" text-anchor="middle">L</text></g>
</defs>
<rect width="1200" height="250" fill="#2B1D12"/>
<rect width="1200" height="12" fill="#D9772B"/><rect y="12" width="1200" height="5" fill="#5F7A3A"/>
<rect y="233" width="1200" height="5" fill="#5F7A3A"/><rect y="238" width="1200" height="12" fill="#D9772B"/>
<rect class="shine" y="0" width="220" height="12" fill="#fff" opacity=".5"/>
<g font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="15" letter-spacing="4" fill="#8FB05A">
<text x="38" y="46">VARIANT NAME<tspan class="tick" fill="#D9772B"> ▮</tspan></text>
<text x="1162" y="46" text-anchor="end" fill="#D9772B">CASE FILE № 0001</text></g>
<g fill="#D9772B" font-size="20" font-family="Georgia,serif"><text class="tw" x="30" y="215">✦</text><text class="tw" x="1150" y="80" style="animation-delay:.7s">✦</text><text class="tw" x="1120" y="215" style="animation-delay:1.4s">✦</text></g>
<use xlink:href="#nm" href="#nm" class="glow" fill="#D9772B" filter="url(#blur)"/>
<use xlink:href="#nm" href="#nm" class="g1" fill="#B3261E"/>
<use xlink:href="#nm" href="#nm" class="g2" fill="#2E9C97"/>
<use xlink:href="#nm" href="#nm" fill="#D9772B"/>
<rect class="bar" x="38" y="168" width="1124" height="6" fill="#5F7A3A"/>
<g class="sub" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="19" letter-spacing="5" fill="#E9D8B4" text-anchor="middle">
<text x="600" y="206">DEVELOPER  ★  IEEE BUILDER  ★  AUTHORIZED VARIANT</text></g>
<g transform="translate(1135,112)" opacity=".0"><g class="spin"><line y2="-10" stroke="#fff"/></g></g>
<rect class="scan" x="0" y="0" width="1200" height="4" fill="#fff" opacity=".12"/>
</svg>