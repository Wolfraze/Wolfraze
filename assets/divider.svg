<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.dash{animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-20}}
.h{animation:s 3s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.p{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}</style>
<line class="dash" x1="0" y1="14" x2="560" y2="14" stroke="#D9772B" stroke-width="3" stroke-dasharray="12 8"/>
<line class="dash" x1="640" y1="14" x2="1200" y2="14" stroke="#D9772B" stroke-width="3" stroke-dasharray="12 8" style="animation-direction:reverse"/>
<g transform="translate(600,14)"><circle r="11" fill="#F4E9CC" stroke="#3B2A1A" stroke-width="3"/>
<line class="h" x1="0" y1="0" x2="0" y2="-7" stroke="#B3261E" stroke-width="2.5" stroke-linecap="round"/><circle r="2" fill="#3B2A1A"/>
<circle class="p" cx="-22" r="3" fill="#5F7A3A"/><circle class="p" cx="22" r="3" fill="#5F7A3A" style="animation-delay:1s"/></g></svg>