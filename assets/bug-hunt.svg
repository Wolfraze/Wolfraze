<style>
.walk{animation:w 8s infinite}@keyframes w{0%{transform:translateX(60px);opacity:1}50%{transform:translateX(540px);opacity:1}51%,100%{transform:translateX(540px);opacity:0}}
.legs{animation:lg .35s ease-in-out infinite}@keyframes lg{50%{transform:translateY(-3px) rotate(3deg)}}
.ret{opacity:0;animation:r 8s infinite;transform-origin:560px 0px}@keyframes r{0%,30%{opacity:0;transform:scale(2)}42%{opacity:1;transform:scale(1)}50%{transform:scale(.7)}52%,100%{opacity:0}}
.boom{opacity:0;transform-origin:560px 0px;animation:b 8s infinite}@keyframes b{0%,50%{opacity:0;transform:scale(.2)}52%{opacity:1}68%,100%{opacity:0;transform:scale(3.4)}}
.pr{opacity:0;animation:p 8s infinite}@keyframes p{0%,51%{opacity:0}56%,86%{opacity:1}95%,100%{opacity:0}}
.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
</style>
