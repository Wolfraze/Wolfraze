<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Time Variance Authority" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.minute{animation:spin 6s linear infinite}
.hour{animation:spin 72s linear infinite}
.orbit{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ear{transform-origin:0px -100px;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.m{opacity:0;animation:msg 15s infinite}
.m2{animation-delay:5s}.m3{animation-delay:10s}
@keyframes msg{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
.scan{animation:scan 3.6s linear infinite}
@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(350px)}}
.shine{animation:shine 4s linear infinite}
@keyframes shine{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}
.g1,.g2{opacity:0}
.g1{animation:gl 5s infinite}.g2{animation:gl 5s infinite .12s}
@keyframes gl{0%,88%,100%{opacity:0;transform:translate(0,0)}90%{opacity:.85;transform:translate(-5px,2px)}93%{opacity:.85;transform:translate(5px,-2px)}96%{opacity:.85;transform:translate(-2px,1px)}}
.slam{animation:slam 6s infinite}
@keyframes slam{0%{transform:scale(3.2);opacity:0}9%{transform:scale(1);opacity:1}11%{transform:scale(1.1)}13%,86%{transform:scale(1);opacity:1}100%{opacity:0;transform:scale(1)}}
.star{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBDDBB"/><stop offset="1" stop-color="#D8C595"/></linearGradient></defs>
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="14" fill="#D9772B"/><rect y="14" width="1200" height="6" fill="#5F7A3A"/>
<rect y="320" width="1200" height="6" fill="#5F7A3A"/><rect y="326" width="1200" height="14" fill="#D9772B"/>
<rect class="shine" x="0" y="0" width="200" height="14" fill="#fff" opacity=".55"/>
<rect class="shine" x="0" y="326" width="200" height="14" fill="#fff" opacity=".55" style="animation-direction:reverse"/>
<g fill="#D9772B" opacity=".5" font-size="20" font-family="Georgia,serif">
<text class="star" x="700" y="60">✦</text><text class="star" x="900" y="40" style="animation-delay:.6s">✦</text>
<text class="star" x="1120" y="200" style="animation-delay:1.2s">✦</text><text class="star" x="40" y="60" style="animation-delay:.9s">✦</text>
<text class="star" x="60" y="300" style="animation-delay:1.5s">✦</text></g>
<g transform="translate(175,180)">
<ellipse cx="0" cy="128" rx="70" ry="9" fill="#000" opacity=".15"/>
<g class="orbit"><circle cx="0" cy="-135" r="6" fill="#D9772B"/><circle cx="135" cy="0" r="4" fill="#5F7A3A"/><circle cx="-135" cy="0" r="5" fill="#B3261E"/></g>
<g class="bob">
<g class="ear"><line x1="0" y1="-105" x2="0" y2="-132" stroke="#3B2A1A" stroke-width="8" stroke-linecap="round"/><circle cy="-140" r="12" fill="#D9772B" stroke="#3B2A1A" stroke-width="6"/></g>
<circle r="105" fill="#D9772B" stroke="#3B2A1A" stroke-width="8"/>
<circle r="82" fill="#F4E9CC" stroke="#3B2A1A" stroke-width="5"/>
<g stroke="#3B2A1A" stroke-width="5" stroke-linecap="round"><line x1="0" y1="-76" x2="0" y2="-66"/><line x1="0" y1="76" x2="0" y2="66"/><line x1="-76" y1="0" x2="-66" y2="0"/><line x1="76" y1="0" x2="66" y2="0"/></g>
<line class="hour" x1="0" y1="0" x2="0" y2="-34" stroke="#3B2A1A" stroke-width="7" stroke-linecap="round"/>
<line class="minute" x1="0" y1="0" x2="0" y2="-54" stroke="#D9772B" stroke-width="5" stroke-linecap="round"/>
<circle r="7" fill="#3B2A1A"/>
<ellipse class="blink" cx="-28" cy="-8" rx="10" ry="15" fill="#3B2A1A"/><ellipse class="blink" cx="28" cy="-8" rx="10" ry="15" fill="#3B2A1A"/>
<circle cx="-25" cy="-13" r="4" fill="#fff"/><circle cx="31" cy="-13" r="4" fill="#fff"/>
<path d="M-32 30 Q0 66 32 30" fill="none" stroke="#3B2A1A" stroke-width="6" stroke-linecap="round"/>
<circle cx="-50" cy="26" r="8" fill="#D9772B" opacity=".6"/><circle cx="50" cy="26" r="8" fill="#D9772B" opacity=".6"/>
</g></g>
<g transform="translate(340,42)">
<path d="M0 20Q0 0 20 0H350Q370 0 370 20V70Q370 90 350 90H70L22 122L36 90H20Q0 90 0 70Z" fill="#F4E9CC" stroke="#3B2A1A" stroke-width="4"/>
<g class="m" font-family="Georgia,'Times New Roman',serif" font-size="21" font-style="italic" fill="#3B2A1A"><text x="22" y="38">Hi there! I'm Miss Minutes.</text><text x="22" y="68">Welcome to this variant's file!</text></g>
<g class="m m2" font-family="Georgia,'Times New Roman',serif" font-size="21" font-style="italic" fill="#3B2A1A"><text x="22" y="38">Please keep all pull requests</text><text x="22" y="68">inside the Time-Door!</text></g>
<g class="m m3" font-family="Georgia,'Times New Roman',serif" font-size="21" font-style="italic" fill="#3B2A1A"><text x="22" y="38">Being pruned is not a bug,</text><text x="22" y="68">it's a feature!</text></g>
</g>
<g font-family="Impact,'Arial Black',Haettenschweiler,sans-serif" font-size="58" letter-spacing="6">
<text class="g1" x="340" y="232" fill="#B3261E">TIME VARIANCE</text><text class="g2" x="340" y="232" fill="#2E7D7A">TIME VARIANCE</text>
<text x="340" y="232" fill="#3B2A1A">TIME VARIANCE</text>
<text class="g1" x="340" y="292" fill="#B3261E">AUTHORITY</text><text x="340" y="292" fill="#D9772B">AUTHORITY</text></g>
<text x="750" y="290" font-family="'Courier New',Courier,monospace" font-size="19" letter-spacing="3" fill="#5F7A3A">★ ALL TIME IS SACRED ★</text>
<g transform="translate(1035,100) rotate(-12)"><g class="slam">
<rect x="-98" y="-40" width="196" height="80" fill="none" stroke="#B3261E" stroke-width="6" rx="6"/>
<text y="-5" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="30" letter-spacing="3" fill="#B3261E">VARIANT</text>
<text y="27" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="26" letter-spacing="3" fill="#B3261E">DETECTED</text></g></g>
<rect class="scan" x="0" y="0" width="1200" height="5" fill="#fff" opacity=".22"/>
</svg>